<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>DevBook - Login</title>

    <link rel='stylesheet' type="text/css" href='/assets/css/login.css'>
</head>
<body>
    <div class="container-login">
        <div>
            <form class="devbook-form" id="login">
                <span>Seja bem vindo ao DevBook!</span>
                <div>
                    <input type="text" name="email" id="email" placeholder="Digite o seu Email" required="required">
                </div>
                <div>
                    <input type="password" name="password" id="password" placeholder="Digite a sua Senha" required="required">
                </div>
                <a href="#"> Clique aqui para criar a sua conta </a>
                <button type="submit" class="btn-devbook">Login</button>
            </form>
        </div>
    </div>
</body>
</html>
