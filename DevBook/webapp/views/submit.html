<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>User Registration</title>
    <link rel='stylesheet' type="text/css" href='/assets/css/login.css'>
</head>
<body>
    <div class="container-login">
        <div>
            <form class="devbook-form" id="formulario-cadastro">
                <span>Create your account!</span>
                <div>
                    <input type="text" name="name" id="name" placeholder="Type your name" required="required">
                </div>
                <div>
                    <input type="text" name="email" id="email" placeholder="Type your Email" required="required">
                </div>
                <div>
                    <input type="text" name="nick" id="nick" placeholder="Type your Nick" required="required">
                </div>
                <div>
                    <input type="password" name="password" id="password" placeholder="Type your Password" required="required">
                </div>
                <div>
                    <input type="password" name="confirm-password" id="confirm-password" placeholder="Confirm your Password" required="required">
                </div>
                <a href="/login"> Click here to login in your account </a>
                <button type="submit" class="btn-devbook">Submit</button>
            </form>
        </div>
    </div>
</body>
</html>
