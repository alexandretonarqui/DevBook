<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>DevBook - Update Your Password </title>
    <link rel='stylesheet' href='/assets/css/bootstrap.css' />
</head>
    <body>
        {{ template "header" }}

        <div class="container-fluid">
            <div class="row mt-4">
                <div class="col-12">
                    <h3>Update Your Password</h3>
                    <form id="update-password">
                        <div class="form-group">
                            <label for="actual-password">Actual Password</label>
                            <input type="password" class="form-control" id="actual-password" name="actual-password" placeholder="Insert your Password" required="required">
                        </div>
                        <div class="form-group">
                            <label for="new-password">New Password</label>
                            <input type="password" class="form-control" id="new-password" name="new-password" placeholder="Insert your New Password" required="required">
                        </div>
                        <div class="form-group">
                            <label for="confirm-password">Confirm Password</label>
                            <input type="password" class="form-control" id="confirm-password" name="confirm-password" placeholder="Confirm your New Password" required="required">
                        </div>
                        <button class="btn btn-info" type="submit">Update Password</button>
                    </form>
                </div>
            </div>
        </div>

        {{ template "footer" }}
        {{ template "scripts" }}

        <script src="/assets/js/user.js"></script>
    </body>
</html>
