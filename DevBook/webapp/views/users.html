<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>DevBook - Users</title>
    <link rel='stylesheet' href='/assets/css/bootstrap.css' />
</head>

<body>
    {{ template "header" }}

    <div class="container-fluid">
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title"> Users Found </h5>
                        {{ range . }}
                            <p class="card-text">
                                {{ .Name }} - <a href="/users/{{ .ID }}">{{ .Nick }}</a> - Member Since: {{ .CreatedAt.Format "02/01/2006" }}
                            </p>
                        {{ else }}
                            <p class="card-text">
                                No Users Found!
                            </p>
                        {{ end }}
                    </div>
                </div>
            </div>
        </div>
    </div>

    {{ template "footer" }}
    {{ template "scripts" }}
</body>

</html>
